# Builds the mod zip and attaches it to a GitHub release.
# Runs when a release is published (tag = version, e.g. 0.6.0) or manually from the Actions tab.
name: Create Release Zip

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual triggering

jobs:
  create-release-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create versioned ZIP
        run: |
          # The zip root must contain scripts/ etc. directly, exactly as in the game's data folder.
          # Development-only files are left out: git files, the BBBuilder cache and the unpacked brush sources.
          zip -r "mod_bombs_reforged-${{ github.event.release.tag_name }}.zip" . -x '*.git*' '.bbbuilder/*' 'unpacked_brushes/*' '.editorconfig' '*.sublime-*'

      - name: Upload to Release
        uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: "mod_bombs_reforged-${{ github.event.release.tag_name }}.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
